version: "3.9"

services:
  caddy:
    image: caddy:2.9-alpine
    container_name: eleven-typesense-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    environment:
      PYTHONPATH: /app
    volumes: []
    command: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

networks:
  edge:
    external: true

volumes:
  caddy_data:
    external: true
  caddy_config:
