version: "3.9"

services:
  db:
    ports:
      - "127.0.0.1:5432:5432"
  typesense:
    ports:
      - "127.0.0.1:8108:8108"
  api:
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
